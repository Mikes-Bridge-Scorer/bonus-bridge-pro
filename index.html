<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1628">
<meta name="description" content="Bonus Bridge Pro — skill-based bridge scoring for 4 players">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="./favicon.ico">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<title>Bonus Bridge Pro</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app-container">
  <header id="app-header">
    <div class="header-top">
      <div class="header-left">♠ Bonus Bridge Pro</div>
      <div class="header-right" id="session-info">Game 1 · Deal 1</div>
    </div>
    <div class="header-sub" id="dealer-vuln-info">Dealer: North — None Vulnerable</div>
    <div class="header-license" id="license-bar"></div>
  </header>

  <main id="dashboard">
    <!-- Populated by app.js -->
  </main>

  <footer id="app-footer">
    <button id="btn-help" class="footer-btn">Help</button>
    <button id="btn-new-game" class="footer-btn">New Game</button>
    <button id="btn-quit" class="footer-btn footer-btn-danger">Quit</button>
  </footer>
</div>

<!-- Popup overlay used for contract/trick/HCP entry and license entry -->
<div id="popup-overlay" class="popup-overlay hidden">
  <div id="popup-content" class="popup-content">
    <!-- Populated by app.js -->
  </div>
</div>

<script src="./scoring.js"></script>
<script src="./license.js"></script>
<script src="./app.js"></script>
</body>
</html>
